# Local dev stack mirroring the AWS deployment shape.
# Redpanda ~ Kinesis, MinIO ~ S3, Postgres ~ RDS, Neo4j ~ Neo4j Aura (local),
# MLflow on the host or in a sidecar container.
# This is NOT for production — it's the single-command "make start" target.

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: idintel-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: idintel-postgres
    environment:
      POSTGRES_DB: identity_intel
      POSTGRES_USER: idintel
      POSTGRES_PASSWORD: idintel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idintel -d identity_intel"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: idintel-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  neo4j:
    image: neo4j:5.20.0-community
    container_name: idintel-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    container_name: idintel-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root s3://mlflow-artifacts/
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "5000:5000"
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - mlflow_data:/mlflow

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: idintel-api
    environment:
      ENVIRONMENT: local
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql+psycopg2://idintel:idintel@postgres:5432/identity_intel
      KAFKA_BOOTSTRAP: redpanda:9092
      EVENT_TOPIC: payment-events
      DECISION_TOPIC: decisions
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: identity-intel-features
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  consumer:
    build:
      context: .
      dockerfile: docker/consumer.Dockerfile
    container_name: idintel-consumer
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg2://idintel:idintel@postgres:5432/identity_intel
      KAFKA_BOOTSTRAP: redpanda:9092
      EVENT_TOPIC: payment-events
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: identity-intel-features
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    deploy:
      replicas: 1

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    container_name: idintel-ui
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  neo4j_data:
  mlflow_data:
