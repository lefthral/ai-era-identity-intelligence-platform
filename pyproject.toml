[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "identity-intel"
version = "0.1.0"
description = "AI-Era Identity Intelligence Platform — real-time deepfake wire-fraud detection."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Identity Intel" }]
requires-python = ">=3.11"
keywords = ["fraud-detection", "streaming", "xgboost", "neo4j", "kinesis", "banking", "deepfake"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "kafka-python>=2.0",
    "boto3>=1.34",
    "google-cloud-pubsub>=2.21",
    "google-cloud-storage>=2.14",
    "google-cloud-firestore>=2.16",
    "google-cloud-sqlalchemy>=1.6",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "minio>=7.2",
    "neo4j>=5.15",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "mlflow>=2.9",
    "shap>=0.44",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic[email]>=2.5",
    "streamlit>=1.30",
    "plotly>=5.18",
    "py2neo>=2021.2.3",
    "faker>=23.0",
    "python-dateutil>=2.8",
    "tenacity>=8.2",
    "structlog>=24.1",
    "httpx>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.8",
    "ipykernel>=6.27",
    "jupyter>=1.0",
    "pre-commit>=3.6",
]

[project.scripts]
# CLI entry points
identity-intel-generate = "scripts.generate_events:main"
identity-intel-train = "src.ml.train:main"
identity-intel-evaluate = "src.ml.evaluate:main"
identity-intel-worker = "src.application.worker:main"

[project.urls]
Homepage = "https://github.com/<your-handle>/identity-intel"
Issues = "https://github.com/<your-handle>/identity-intel/issues"

# --- Setuptools config ---
[tool.setuptools]
packages = [
    "src",
    "src.domain",
    "src.application",
    "src.generators",
    "src.infrastructure",
    "src.infrastructure.adapters",
    "src.infrastructure.adapters.local",
    "src.infrastructure.adapters.aws",
    "src.infrastructure.adapters.gcp",
    "src.infrastructure.persistence",
    "src.infrastructure.graph",
    "src.ml",
]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

# --- Tooling: ruff ---
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", ".venv", "models"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by black
    "B008",  # FastAPI's Query/Path in defaults
    "RUF012", # mutable class attributes (Pydantic models)
    "UP042",  # `class Foo(str, Enum)` is the explicit, widely-used pattern for StrEnum
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # Allow `assert` in tests
"lambdas/*" = ["E402"]  # Lambda needs sys.path manipulation

[tool.ruff.lint.isort]
known-first-party = ["src", "tests", "scripts"]

# --- Tooling: black ---
[tool.black]
line-length = 100
target-version = ["py311", "py312"]

# --- Tooling: mypy ---
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true

# --- Tooling: pytest ---
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -v --tb=short"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
